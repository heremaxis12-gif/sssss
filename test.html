<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0F0F0F;
            color: #F5F1E8;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #D4AF37;
        }
        h1 {
            color: #D4AF37;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .status {
            color: #D4AF37;
            font-weight: bold;
            margin: 20px 0;
            padding: 10px;
            border: 1px dashed #D4AF37;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HTML Test Page</h1>
        <p>If you can see this page, HTML files are working correctly on your system.</p>
        <div class="status">Status: Working Successfully</div>
        <p>The Shavoraplace preview files should also work correctly.</p>
        <p>Simply double-click on either <strong>preview.html</strong> or <strong>admin-preview.html</strong> to open them in your browser.</p>
    </div>
</body>
</html>
